version: '3.8'

services:
  # PostgreSQL for Keycloak
  postgres:
    image: postgres:16-alpine
    container_name: mtk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mtk-network

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: mtk-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123

      # Keycloak Admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

      # Hostname
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true

      # Proxy
      KC_PROXY: edge

      # Development Settings
      KC_HEALTH_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - mtk-network

  # PostgreSQL for MTK Application
  mtk-postgres:
    image: postgres:16-alpine
    container_name: mtk-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: MTK
      POSTGRES_USER: mtkuser
      POSTGRES_PASSWORD: MTK@Password123
    ports:
      - "5433:5432"
    volumes:
      - mtk_postgres_data:/var/lib/postgresql/data
    networks:
      - mtk-network

volumes:
  postgres_data:
    driver: local
  mtk_postgres_data:
    driver: local

networks:
  mtk-network:
    driver: bridge
