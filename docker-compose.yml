version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mtk-rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: mtk-admin
      RABBITMQ_DEFAULT_PASS: MTK@RabbitMQ123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mtk-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: mtk-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: MTK
      POSTGRES_USER: mtkuser
      POSTGRES_PASSWORD: MTK@Password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mtk-network
    restart: unless-stopped

  keycloak-postgres:
    image: postgres:16-alpine
    container_name: mtk-keycloak-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - mtk-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: mtk-keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: false
      KC_PROXY: edge
    depends_on:
      - keycloak-postgres
    networks:
      - mtk-network
    restart: unless-stopped

volumes:
  rabbitmq_data:
  postgres_data:
  keycloak_postgres_data:

networks:
  mtk-network:
    driver: bridge
